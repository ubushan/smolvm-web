        <label style="border: 2px solid #C2582A; background: #FBEDE4; border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; font-size: 14px"><input type="radio" name="files" checked><span><b>Копия ~/src/api</b><br><span style="color: #6F6156">правки — после проверки</span></span></label>
